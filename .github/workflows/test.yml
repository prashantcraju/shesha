name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: Test import
      run: |
        python -c "import shesha; print(f'Shesha version: {shesha.__version__}')"
        python -c "import shesha.bio; import shesha.sim; print('All modules imported successfully')"

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install lint tools
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Ruff
      run: ruff check shesha tests

    - name: Black
      run: black --check shesha tests

  package:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine pytest pytest-cov

    - name: Build, check, and test the wheel
      run: |
        python -m build
        python -m twine check dist/*
        WHEEL_PATH="$(python -c 'import glob, pathlib; print(pathlib.Path(glob.glob("dist/*.whl")[0]).resolve())')"
        TEST_DIR="$(mktemp -d)"
        cp -R tests "$TEST_DIR/tests"
        cd "$TEST_DIR"
        python -m pip install "$WHEEL_PATH"
        python -m pip install pytest anndata scikit-learn statsmodels packaging
        python -c "import pathlib, shesha; path = pathlib.Path(shesha.__file__).resolve(); print(shesha.__version__, path); assert 'site-packages' in str(path)"
        pytest tests/ -v --tb=short

  docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt
        pip install .

    - name: Build documentation
      run: sphinx-build -W --keep-going -b html docs docs/_build/html

  test-with-coverage:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    
    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=shesha --cov-report=xml --cov-report=term

    - name: Run deterministic similarity example
      run: python examples/similarity_comparison.py
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
